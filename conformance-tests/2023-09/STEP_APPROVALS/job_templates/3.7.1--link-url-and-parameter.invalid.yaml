# Template Schemas §3.7.1: a link has exactly one of url or parameter, not both.
specificationVersion: jobtemplate-2023-09
extensions:
- STEP_APPROVALS
name: TestJob
parameterDefinitions:
- name: OutputDir
  type: PATH
  default: /mnt/out
steps:
- name: Review
  approval:
    message: Approve?
    links:
    - label: Both
      url: https://example.com
      parameter: OutputDir
