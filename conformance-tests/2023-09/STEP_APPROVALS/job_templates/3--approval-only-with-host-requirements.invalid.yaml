# Template Schemas §3: an approval-only Step must not have hostRequirements.
specificationVersion: jobtemplate-2023-09
extensions:
- STEP_APPROVALS
name: TestJob
steps:
- name: Review
  approval:
    message: Approve?
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
