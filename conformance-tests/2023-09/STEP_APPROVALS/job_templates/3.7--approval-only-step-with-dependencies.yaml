# Template Schemas §3 and §3.7: a Step with an approval and no script is an approval-only Step.
# Another Step may depend on it.
specificationVersion: jobtemplate-2023-09
extensions:
- STEP_APPROVALS
name: TestJob
steps:
- name: Preview
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
- name: Review
  dependencies:
  - dependsOn: Preview
  approval:
    message: Check the preview before the final render.
- name: Final
  dependencies:
  - dependsOn: Review
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
