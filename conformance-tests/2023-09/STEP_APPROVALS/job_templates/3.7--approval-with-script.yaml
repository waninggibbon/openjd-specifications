# Template Schemas §3 and §3.7: a Step may have both an approval and a script.
# The Step's Tasks wait for the decision. The message uses Job.Name and Step.Name,
# which need the EXPR extension (§3.7.3, §7.3.1).
specificationVersion: jobtemplate-2023-09
extensions:
- STEP_APPROVALS
- EXPR
name: TestJob
parameterDefinitions:
- name: ShotName
  type: STRING
  default: sh010
steps:
- name: Step1
  approval:
    message: "Render {{Param.ShotName}} on large hosts? Job {{Job.Name}}, Step {{Step.Name}}."
  script:
    actions:
      onRun:
        command: python
        args:
        - "-c"
        - "print()"
