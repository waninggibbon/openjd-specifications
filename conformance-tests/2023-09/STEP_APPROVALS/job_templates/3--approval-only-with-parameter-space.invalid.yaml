# Template Schemas §3: an approval-only Step must not have parameterSpace.
specificationVersion: jobtemplate-2023-09
extensions:
- STEP_APPROVALS
name: TestJob
steps:
- name: Review
  approval:
    message: Approve?
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "1-3"
